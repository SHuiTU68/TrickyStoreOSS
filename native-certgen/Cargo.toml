[package]
name = "certgen"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
ring = "0.17.14"
rsa = { version = "0.9", features = ["sha2"] }
p256 = "0.13"
p384 = "0.13"
pkcs8 = { version = "0.10", features = ["alloc"] }
spki = { version = "0.7", features = ["alloc"] }
rand = "0.8"
der = { version = "0.7.10", features = ["alloc", "oid"] }
x509-cert = { version = "0.2.5", features = ["pem"] }
const-oid = "0.9.6"
time = { version = "0.3", features = ["std"] }
zeroize = "1.9"

[profile.release]
# Key generation and certificate signing here are almost entirely big-integer and prime-field
# arithmetic (ring, rsa, p256, p384), which is exactly the shape opt-level "z" gives up the most
# on: it disables the vectorised and unrolled variants of those inner loops to save code size.
# The CI probe measured the switch at +40 KB in libcertgen.so (.text 640 KB -> 788 KB), which is
# cheaper than the ~318 KB reclaimed by rebuilding std under the immediate-abort panic strategy,
# so the release profile buys speed here and pays for it with that budget instead.
opt-level = 2
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
