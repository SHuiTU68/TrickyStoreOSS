name: Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'
      - 'update.json'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'
      - 'update.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      releaseName: ${{ steps.prepareArtifact.outputs.releaseName }}
      debugName: ${{ steps.prepareArtifact.outputs.debugName }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # libcertgen.so is linked against std rebuilt from source under the immediate-abort panic
      # strategy: that is what drops the formatting machinery behind `panic!`, and it measured
      # 318 KB off the library with every `panicked at` string gone. Rebuilding std needs `-Z`,
      # which needs nightly, so a second toolchain is installed next to the pinned stable one.
      # native-certgen/rust-toolchain.toml stays on stable for everything else (including the
      # `cargo test` gates below); the Gradle task overrides it with RUSTUP_TOOLCHAIN for this
      # one build. rust-src is what build-std compiles from.
      # The date is pinned to keep the shipped library reproducible — keep in sync with
      # `buildStdNightly` in app/build.gradle.kts (override there with TSTORE_NIGHTLY).
      - name: Setup pinned nightly Rust toolchain (build-std for libcertgen)
        run: rustup toolchain install nightly-2026-10-23 --profile minimal --component rust-src --target aarch64-linux-android

      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            native-certgen/target
            native-inject/target
            native-daemon/target
          key: rust-${{ runner.os }}-${{ hashFiles('native-certgen/Cargo.lock', 'native-inject/Cargo.lock', 'native-daemon/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}
            ccache-${{ runner.os }}-
            ccache-

      # The Rust crate now owns every code path (key generation, chain building, attestation
      # extension, leaf rewriting), so its unit tests gate the build instead of running only on a
      # developer machine. They are host-only and need no NDK.
      - name: Test Rust crate
        working-directory: native-certgen
        run: cargo test --locked
      # The injector's pure-logic half (maps parsing, wait-status/PTRACE_EVENT rendering, magic
      # generation, SELinux knobs) lives in native-inject and is linked into libinject.so, so its
      # tests gate the build too.
      - name: Test Rust injection helpers
        working-directory: native-inject
        run: cargo test --locked
      # The daemon owns config parsing, the probe plumbing and the interceptor decision logic,
      # so its tests gate the build alongside the other two crates.
      - name: Test Rust daemon logic
        working-directory: native-daemon
        run: cargo test --locked

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build with Gradle
        env:
          # Opts libcertgen into the std rebuild described above. Everything else in the
          # Gradle build stays on the pinned stable toolchain.
          TSTORE_BUILD_STD: "1"
        # testDebugUnitTest gates the Kotlin layer (request parsing, auth-policy validity,
        # the platform keygen fallback) alongside the Rust crate tests above.
        run: ./gradlew --parallel assembleRelease assembleDebug lintRelease testDebugUnitTest --stacktrace

      - name: Prepare artifact
        id: prepareArtifact
        run: |
          set -e
          RELEASE_FILE=$(find out -name "*Release*.zip" | head -1)
          DEBUG_FILE=$(find out -name "*Debug*.zip" | head -1)

          if [[ -z "$RELEASE_FILE" || -z "$DEBUG_FILE" ]]; then
            echo "::error::Could not find release or debug files in out/"
            ls -la out/ || echo "out/ directory does not exist"
            exit 1
          fi

          echo "releaseName=$(basename "$RELEASE_FILE" .zip)" >> "$GITHUB_OUTPUT"
          echo "debugName=$(basename "$DEBUG_FILE" .zip)" >> "$GITHUB_OUTPUT"
          echo "releaseFile=$RELEASE_FILE" >> "$GITHUB_OUTPUT"
          echo "debugFile=$DEBUG_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.releaseName }}
          path: ${{ steps.prepareArtifact.outputs.releaseFile }}
          retention-days: 30
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.debugName }}
          path: ${{ steps.prepareArtifact.outputs.debugFile }}
          retention-days: 7
          archive: false

      - name: Upload release mappings
        uses: actions/upload-artifact@v7
        with:
          name: release-mappings-${{ github.run_number }}
          path: "./app/build/outputs/mapping/release"
          retention-days: 30
          compression-level: 9

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Gradle Tasks**: assembleRelease, assembleDebug, lintRelease" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "- **Release Artifact**: ${{ steps.prepareArtifact.outputs.releaseName }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Debug Artifact**: ${{ steps.prepareArtifact.outputs.debugName }}" >> $GITHUB_STEP_SUMMARY
          fi

  dependency-submission:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v6.4.0
